<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Mirage TikTok pipeline cloud architecture</title>
<desc>A daily routine starts a Claude Code cloud session that clones the GitHub repo, then runs the agent, voice, avatar, matte, Tesseract edit, review and packaging steps. The voice step calls ElevenLabs, the avatar step calls the Mirage API, and files move to and from Google Drive with rclone. You review videos in Drive and upload to TikTok manually.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .purple .t1 { fill: #3C3489; } .purple .t2 { fill: #534AB7; }
    .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .teal .t1 { fill: #085041; } .teal .t2 { fill: #0F6E56; }
    .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
    .gray .t1 { fill: #2C2C2A; } .gray .t2 { fill: #5F5E5A; }
    .t1 { font-size: 14px; font-weight: 600; }
    .t2 { font-size: 12px; }
    .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  </style>
</defs>
<rect x="0" y="0" width="680" height="650" fill="#FFFFFF"/>
<rect x="190" y="40" width="300" height="500" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Claude Code cloud session</text>

<g class="purple"><rect x="210" y="90" width="260" height="48" rx="8" stroke-width="1"/><text class="t1" x="340" y="110" text-anchor="middle">Claude agent (Sonnet 5.5)</text><text class="t2" x="340" y="128" text-anchor="middle">Follows ROUTINE.md, writes script</text></g>
<line x1="340" y1="138" x2="340" y2="156" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="210" y="158" width="260" height="48" rx="8" stroke-width="1"/><text class="t1" x="340" y="178" text-anchor="middle">Voice step</text><text class="t2" x="340" y="196" text-anchor="middle">Script to your cloned voice</text></g>
<line x1="340" y1="206" x2="340" y2="224" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="210" y="226" width="260" height="48" rx="8" stroke-width="1"/><text class="t1" x="340" y="246" text-anchor="middle">Avatar step</text><text class="t2" x="340" y="264" text-anchor="middle">Voice + reference clip to video</text></g>
<line x1="340" y1="274" x2="340" y2="292" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="210" y="294" width="260" height="48" rx="8" stroke-width="1"/><text class="t1" x="340" y="314" text-anchor="middle">Matte (Robust Video Matting)</text><text class="t2" x="340" y="332" text-anchor="middle">Cuts you out, runs on CPU</text></g>
<line x1="340" y1="342" x2="340" y2="360" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="210" y="362" width="260" height="48" rx="8" stroke-width="1"/><text class="t1" x="340" y="382" text-anchor="middle">Edit (Mirage Tesseract CLI)</text><text class="t2" x="340" y="400" text-anchor="middle">Paper II template to MP4</text></g>
<line x1="340" y1="410" x2="340" y2="428" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="210" y="430" width="260" height="48" rx="8" stroke-width="1"/><text class="t1" x="340" y="450" text-anchor="middle">Review and package</text><text class="t2" x="340" y="468" text-anchor="middle">Finished videos to ready/</text></g>

<g class="gray"><rect x="30" y="90" width="140" height="56" rx="8" stroke-width="1"/><text class="t1" x="100" y="113" text-anchor="middle">Routine</text><text class="t2" x="100" y="132" text-anchor="middle">Daily, 6am PT</text></g>
<line x1="170" y1="114" x2="208" y2="114" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="30" y="226" width="140" height="56" rx="8" stroke-width="1"/><text class="t1" x="100" y="249" text-anchor="middle">GitHub repo</text><text class="t2" x="100" y="268" text-anchor="middle">Code, instructions</text></g>
<line x1="170" y1="254" x2="188" y2="254" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="510" y="158" width="150" height="48" rx="8" stroke-width="1"/><text class="t1" x="585" y="178" text-anchor="middle">ElevenLabs</text><text class="t2" x="585" y="196" text-anchor="middle">Text to speech</text></g>
<line x1="472" y1="182" x2="508" y2="182" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="teal"><rect x="510" y="226" width="150" height="48" rx="8" stroke-width="1"/><text class="t1" x="585" y="246" text-anchor="middle">Mirage API</text><text class="t2" x="585" y="264" text-anchor="middle">Avatar X render</text></g>
<line x1="472" y1="250" x2="508" y2="250" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="teal"><rect x="510" y="300" width="150" height="150" rx="8" stroke-width="1"/><text class="t1" x="585" y="328" text-anchor="middle">Google Drive</text><text class="t2" x="585" y="354" text-anchor="middle">via rclone</text><text class="t2" x="585" y="382" text-anchor="middle">topics.csv, assets</text><text class="t2" x="585" y="404" text-anchor="middle">reference clip</text><text class="t2" x="585" y="426" text-anchor="middle">videos, ready</text></g>
<line x1="492" y1="375" x2="508" y2="375" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<line x1="585" y1="452" x2="585" y2="558" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="510" y="560" width="150" height="48" rx="8" stroke-width="1"/><text class="t1" x="585" y="580" text-anchor="middle">You (phone)</text><text class="t2" x="585" y="598" text-anchor="middle">Review in Drive</text></g>
<line x1="510" y1="584" x2="472" y2="584" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="320" y="560" width="150" height="48" rx="8" stroke-width="1"/><text class="t1" x="395" y="580" text-anchor="middle">TikTok</text><text class="t2" x="395" y="598" text-anchor="middle">Manual upload</text></g>

<rect x="30" y="572" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="50" y="583" font-size="12" fill="#5F5E5A">Runs in Claude's cloud</text>
<rect x="30" y="596" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="50" y="607" font-size="12" fill="#5F5E5A">External service</text>
</svg>
